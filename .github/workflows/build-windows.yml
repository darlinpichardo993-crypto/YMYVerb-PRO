name: Build YMYVerb PRO (Windows)

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: VST3 + Standalone + pluginval + DSP tests + Setup.exe (x64)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup installation failed."
          }

      - name: Configure, compile, test, and package
        shell: pwsh
        run: ./scripts/build_windows.ps1 -NoPause

      - name: Validate VST3 with pluginval
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "pluginval_Windows.zip"
          $validatorDir = Join-Path $env:RUNNER_TEMP "pluginval"
          $validationLogs = Join-Path $env:GITHUB_WORKSPACE "dist\\pluginval-logs"
          Invoke-WebRequest -Uri "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $validatorDir -Force
          $validator = Get-ChildItem -Path $validatorDir -Recurse -File -Filter "pluginval.exe" | Select-Object -First 1
          if (-not $validator) { throw "Could not find pluginval.exe after extraction." }
          New-Item -ItemType Directory -Force -Path $validationLogs | Out-Null
          $plugin = Join-Path $env:GITHUB_WORKSPACE "dist\\YMYVerb.vst3"
          & $validator.FullName --validate-in-process --strictness-level 5 --output-dir $validationLogs $plugin
          if ($LASTEXITCODE -ne 0) {
            throw "pluginval failed to load or validate YMYVerb. See pluginval logs in the job artifacts."
          }

      - name: Verify VST3, standalone app, and installer
        shell: pwsh
        run: |
          $dist = Join-Path $env:GITHUB_WORKSPACE "dist"
          $plugin = Join-Path $dist "YMYVerb.vst3"
          $installer = Join-Path $dist "YMYVerb_Setup.exe"
          $standalone = Join-Path $dist "YMYVerb.exe"

          if (-not (Test-Path $plugin -PathType Container)) {
            throw "The staged VST3 bundle is missing."
          }
          $binary = Get-ChildItem -Path $plugin -Recurse -File -Filter "*.vst3" |
            Select-Object -First 1
          if (-not $binary) {
            throw "The staged bundle does not contain a VST3 binary."
          }
          if (-not (Test-Path $standalone -PathType Leaf)) {
            throw "The standalone desktop application is missing."
          }
          if ((Get-Item $standalone).Length -lt 100000) {
            throw "The standalone executable is suspiciously small."
          }
          if (-not (Test-Path $installer -PathType Leaf)) {
            throw "The installer executable is missing."
          }
          if ((Get-Item $installer).Length -lt 100000) {
            throw "The installer executable is suspiciously small."
          }
          Write-Host "VST3 binary: $($binary.FullName) ($($binary.Length) bytes)"
          Write-Host "Standalone: $standalone ($((Get-Item $standalone).Length) bytes)"
          Write-Host "Installer: $installer ($((Get-Item $installer).Length) bytes)"


      - name: Upload pluginval diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: YMYVerb-pluginval-diagnostics
          path: dist/pluginval-logs/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YMYVerb-PRO-Windows-x64
          path: |
            dist/YMYVerb.vst3/**
            dist/YMYVerb.exe
            dist/YMYVerb_Setup.exe
            dist/pluginval-logs/**
          if-no-files-found: error
          retention-days: 30
