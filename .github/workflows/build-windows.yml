name: Build YMYVerb PRO (Windows)

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: VST3 + DSP tests + Setup.exe (x64)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup installation failed."
          }

      - name: Configure, compile, test, and package
        shell: pwsh
        run: ./scripts/build_windows.ps1 -NoPause

      - name: Verify VST3 and installer
        shell: pwsh
        run: |
          $dist = Join-Path $env:GITHUB_WORKSPACE "dist"
          $plugin = Join-Path $dist "YMYVerb.vst3"
          $installer = Join-Path $dist "YMYVerb_Setup.exe"

          if (-not (Test-Path $plugin -PathType Container)) {
            throw "The staged VST3 bundle is missing."
          }
          $binary = Get-ChildItem -Path $plugin -Recurse -File -Filter "*.vst3" |
            Select-Object -First 1
          if (-not $binary) {
            throw "The staged bundle does not contain a VST3 binary."
          }
          if (-not (Test-Path $installer -PathType Leaf)) {
            throw "The installer executable is missing."
          }
          if ((Get-Item $installer).Length -lt 100000) {
            throw "The installer executable is suspiciously small."
          }
          Write-Host "VST3 binary: $($binary.FullName) ($($binary.Length) bytes)"
          Write-Host "Installer: $installer ($((Get-Item $installer).Length) bytes)"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YMYVerb-PRO-Windows-x64
          path: |
            dist/YMYVerb.vst3/**
            dist/YMYVerb_Setup.exe
          if-no-files-found: error
          retention-days: 30
